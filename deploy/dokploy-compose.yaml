services:
  postgres:
    user: "70:70"
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_publisher
      POSTGRES_USER: content_publisher
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - content-publisher-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_publisher -d content_publisher"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  publisher:
    image: content-publisher:${PUBLISHER_IMAGE_TAG:?PUBLISHER_IMAGE_TAG must be an immutable version-git-sha tag}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/content_publisher
      DB_USERNAME: content_publisher
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PUBLISHER_SECURITY_MODE: ${PUBLISHER_SECURITY_MODE:-LOCAL}
      PUBLISHER_SECURITY_TENANT_CLAIM: ${PUBLISHER_SECURITY_TENANT_CLAIM:-tenant_id}
      PUBLISHER_SECURITY_ROLES_CLAIM: ${PUBLISHER_SECURITY_ROLES_CLAIM:-roles}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-}
      PUBLISHER_LOCAL_ADMIN_USERNAME: ${PUBLISHER_LOCAL_ADMIN_USERNAME:-}
      PUBLISHER_LOCAL_ADMIN_PASSWORD: ${PUBLISHER_LOCAL_ADMIN_PASSWORD:-}
      PUBLISHER_LOCAL_ADMIN_TENANT: ${PUBLISHER_LOCAL_ADMIN_TENANT:-local}
      PUBLISHER_LOCAL_ADMIN_MUST_CHANGE_PASSWORD: ${PUBLISHER_LOCAL_ADMIN_MUST_CHANGE_PASSWORD:-true}
      PUBLISHER_SESSION_COOKIE_SECURE: "true"
      PUBLISHER_SESSION_TIMEOUT: ${PUBLISHER_SESSION_TIMEOUT:-30m}
      PUBLISHER_JOBS_WORKER_ENABLED: ${PUBLISHER_JOBS_WORKER_ENABLED:-true}
      PUBLISHER_JOBS_MAX_ACTIVE_PER_TENANT: ${PUBLISHER_JOBS_MAX_ACTIVE_PER_TENANT:-20}
      PUBLISHER_JOBS_MAX_ATTEMPTS: ${PUBLISHER_JOBS_MAX_ATTEMPTS:-4}
      PUBLISHER_JOBS_POLL_INTERVAL: ${PUBLISHER_JOBS_POLL_INTERVAL:-1s}
      PUBLISHER_JOBS_LOCK_TIMEOUT: ${PUBLISHER_JOBS_LOCK_TIMEOUT:-5m}
      PUBLISHER_JOBS_INITIAL_RETRY_DELAY: ${PUBLISHER_JOBS_INITIAL_RETRY_DELAY:-10s}
      PUBLISHER_JOBS_MAX_RETRY_DELAY: ${PUBLISHER_JOBS_MAX_RETRY_DELAY:-5m}
      GIT_WORK_DIRECTORY: /data/tmp/content-publisher
      GIT_ALLOWED_HOSTS: ${GIT_ALLOWED_HOSTS:-github.com,gitlab.com,gitee.com}
      GIT_TIMEOUT_SECONDS: ${GIT_TIMEOUT_SECONDS:-30}
      GIT_MAX_REPOSITORY_BYTES: ${GIT_MAX_REPOSITORY_BYTES:-104857600}
      GIT_MAX_FILES: ${GIT_MAX_FILES:-2000}
      GIT_MAX_README_CHARACTERS: ${GIT_MAX_README_CHARACTERS:-60000}
      PUBLISHER_WEBSITE_TIMEOUT: ${PUBLISHER_WEBSITE_TIMEOUT:-20s}
      PUBLISHER_WEBSITE_MAX_RESPONSE_BYTES: ${PUBLISHER_WEBSITE_MAX_RESPONSE_BYTES:-2000000}
      PUBLISHER_WEBSITE_MAX_TEXT_CHARACTERS: ${PUBLISHER_WEBSITE_MAX_TEXT_CHARACTERS:-100000}
      PUBLISHER_WEBSITE_MIN_TEXT_CHARACTERS: ${PUBLISHER_WEBSITE_MIN_TEXT_CHARACTERS:-20}
      PUBLISHER_AI_ENABLED: ${PUBLISHER_AI_ENABLED:-false}
      PUBLISHER_AI_BASE_URL: ${PUBLISHER_AI_BASE_URL:-http://127.0.0.1:11434/v1}
      PUBLISHER_AI_API_KEY: ${PUBLISHER_AI_API_KEY:-}
      PUBLISHER_AI_MODEL: ${PUBLISHER_AI_MODEL:-qwen3:14b}
      PUBLISHER_AI_TIMEOUT: ${PUBLISHER_AI_TIMEOUT:-90s}
      PUBLISHER_AI_TEMPERATURE: ${PUBLISHER_AI_TEMPERATURE:-0.2}
      PUBLISHER_AI_ALLOWED_HOSTS: ${PUBLISHER_AI_ALLOWED_HOSTS:-}
      PUBLISHER_AI_ALLOW_PRIVATE_ADDRESSES: ${PUBLISHER_AI_ALLOW_PRIVATE_ADDRESSES:-false}
      PUBLISHER_SECRETS_ENCRYPTION_KEY: ${PUBLISHER_SECRETS_ENCRYPTION_KEY:?PUBLISHER_SECRETS_ENCRYPTION_KEY is required}
      PUBLISHER_CHANNELS_ENABLED: ${PUBLISHER_CHANNELS_ENABLED:-false}
      PUBLISHER_CHANNELS_ENCRYPTION_KEY: ${PUBLISHER_CHANNELS_ENCRYPTION_KEY:?PUBLISHER_CHANNELS_ENCRYPTION_KEY is required}
      PUBLISHER_CHANNELS_ALLOWED_HOSTS: ${PUBLISHER_CHANNELS_ALLOWED_HOSTS:-}
      PUBLISHER_CHANNELS_TIMEOUT: ${PUBLISHER_CHANNELS_TIMEOUT:-30s}
      PUBLISHER_CHANNEL_HEALTH_ENABLED: ${PUBLISHER_CHANNEL_HEALTH_ENABLED:-true}
      PUBLISHER_CHANNEL_HEALTH_INTERVAL: ${PUBLISHER_CHANNEL_HEALTH_INTERVAL:-15m}
      PUBLISHER_CHANNEL_HEALTH_STALE_AFTER: ${PUBLISHER_CHANNEL_HEALTH_STALE_AFTER:-24h}
      PUBLISHER_CHANNEL_HEALTH_BATCH_SIZE: ${PUBLISHER_CHANNEL_HEALTH_BATCH_SIZE:-50}
      PUBLISHER_NOTIFICATION_WEBHOOK_ENABLED: ${PUBLISHER_NOTIFICATION_WEBHOOK_ENABLED:-true}
      PUBLISHER_NOTIFICATION_WEBHOOK_INTERVAL: ${PUBLISHER_NOTIFICATION_WEBHOOK_INTERVAL:-30s}
      PUBLISHER_NOTIFICATION_WEBHOOK_TIMEOUT: ${PUBLISHER_NOTIFICATION_WEBHOOK_TIMEOUT:-10s}
      PUBLISHER_NOTIFICATION_WEBHOOK_BATCH_SIZE: ${PUBLISHER_NOTIFICATION_WEBHOOK_BATCH_SIZE:-50}
      PUBLISHER_NOTIFICATION_WEBHOOK_MAX_ATTEMPTS: ${PUBLISHER_NOTIFICATION_WEBHOOK_MAX_ATTEMPTS:-4}
      PUBLISHER_METRICS_REFRESH_INTERVAL: ${PUBLISHER_METRICS_REFRESH_INTERVAL:-30s}
      PUBLISHER_OPENAPI_ENABLED: "false"
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770
      - /data/tmp/content-publisher:uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    stop_grace_period: 40s
    networks:
      - backend
      - dokploy-network

volumes:
  content-publisher-postgres:
    name: content-publisher-postgres

networks:
  backend:
    internal: true
  dokploy-network:
    external: true
