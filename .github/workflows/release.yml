name: Build immutable release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build release directory
        run: ./scripts/release
      - name: Build immutable image
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Export image archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: content-publisher:${{ github.ref_name }}-${{ github.sha }}
          outputs: type=docker,dest=target/content-publisher-image.tar
      - name: Add image checksum
        run: sha256sum target/content-publisher-image.tar >target/content-publisher-image.tar.sha256
      - name: Upload immutable release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-publisher-${{ github.ref_name }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/releases/
            target/content-publisher-image.tar
            target/content-publisher-image.tar.sha256
