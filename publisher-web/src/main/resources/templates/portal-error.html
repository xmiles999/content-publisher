<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow"><title>操作失败 · Content Publisher</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/logo.svg}">
    <script th:src="@{/assets/theme-init.js}"></script><link rel="stylesheet" th:href="@{/assets/app.css}"><script defer th:src="@{/assets/app.js}"></script></head>
<body class="dashboard-page">
<button class="theme-toggle theme-toggle-floating" type="button" data-theme-toggle>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.75v2M10 15.25v2M2.75 10h2M15.25 10h2M4.87 4.87l1.42 1.42M13.71 13.71l1.42 1.42M15.13 4.87l-1.42 1.42M6.29 13.71l-1.42 1.42"/><circle cx="10" cy="10" r="3.25"/></svg>
    <span data-theme-label>跟随系统</span>
</button>
<main class="message-shell"><section class="message-card">
    <span class="message-code" th:text="${status != null ? status : code}">错误</span><p class="eyebrow dark">请求失败</p><h1>无法完成当前操作</h1>
    <p th:text="${message}">请求处理失败。</p><small class="message-path" th:if="${requestPath != null and !#strings.isEmpty(requestPath)}" th:text="${requestPath}">/path</small>
    <div class="message-actions"><a class="primary-link" th:href="@{/}">返回总览</a><button class="secondary-button" type="button" data-history-back>返回上一页</button></div>
</section></main></body></html>
