<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<aside id="app-sidebar" class="app-sidebar" th:fragment="sidebar" aria-label="应用导航">
    <svg class="sidebar-icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="nav-create" viewBox="0 0 20 20"><path d="M5 3.5h6l4 4V17H5z"/><path d="M11 3.5V8h4M8 12h4M10 10v4"/></symbol>
        <symbol id="nav-library" viewBox="0 0 20 20"><path d="M5 4h10v12H5z"/><path d="M8 7h4M8 10h4M8 13h3"/></symbol>
        <symbol id="nav-actions" viewBox="0 0 20 20"><path d="M6 4h8v13H6z"/><path d="M8 4V3h4v1M8.5 10l1.2 1.2L12.5 8.5"/></symbol>
        <symbol id="nav-publish" viewBox="0 0 20 20"><path d="M4 16 16 4M9 4h7v7"/><path d="M8 6H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-3"/></symbol>
        <symbol id="nav-operations" viewBox="0 0 20 20"><path d="M3 10h3l2-4 4 8 2-4h3"/><path d="M4 4.5h12v11H4z"/></symbol>
        <symbol id="nav-recycle" viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/><path d="M9 9v5M11 9v5"/></symbol>
        <symbol id="nav-ai" viewBox="0 0 20 20"><path d="m10 3 .8 2.2L13 6l-2.2.8L10 9l-.8-2.2L7 6l2.2-.8zM5 10l.6 1.4L7 12l-1.4.6L5 14l-.6-1.4L3 12l1.4-.6zM14.5 10l1 2.5L18 13.5l-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z"/></symbol>
        <symbol id="nav-automation" viewBox="0 0 20 20"><path d="M4 5h12M4 10h12M4 15h12"/><path d="M7 3v4M13 8v4M9 13v4"/></symbol>
        <symbol id="nav-chevron" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"/></symbol>
    </svg>
    <div class="sidebar-brand">
        <a th:href="@{/}" class="brand-lockup" title="我的文稿">
            <img th:src="@{/assets/logo.svg}" alt="Content Publisher">
            <span><strong>Publisher</strong><small>个人文稿工作区</small></span>
        </a>
        <div class="sidebar-brand-actions">
            <button class="sidebar-compact-toggle" type="button" data-sidebar-compact aria-controls="app-sidebar"
                    aria-expanded="true" aria-label="切换为紧凑导航" title="切换侧栏宽度">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h12v12H4zM8 4v12M11 8h3M11 12h3"/></svg>
            </button>
            <button class="sidebar-close" type="button" data-sidebar-close aria-controls="app-sidebar" aria-label="关闭导航">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
            </button>
        </div>
    </div>

    <nav class="sidebar-nav" aria-label="主导航">
        <a th:href="@{/content}" title="文稿"  th:classappend="${activeItem == 'content'} ? ' active'" th:attr="aria-current=${activeItem == 'content' ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-library"></use></svg><span class="nav-label">文稿</span>
        </a>
        <a th:href="@{/projects(source='custom')}" title="写新稿" th:if="${canEdit}" th:classappend="${#strings.startsWith(activeItem, 'projects')} ? ' active'" th:attr="aria-current=${#strings.startsWith(activeItem, 'projects') ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-create"></use></svg><span class="nav-label">写新稿</span>
        </a>
        <a th:href="@{/publishing}" title="发布"  th:classappend="${#strings.startsWith(activeItem, 'publishing')} ? ' active'" th:attr="aria-current=${#strings.startsWith(activeItem, 'publishing') ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-publish"></use></svg><span class="nav-label">发布</span><span class="nav-count" th:if="${navigationCounts.pendingPublicationCount > 0}" th:text="${navigationCounts.pendingPublicationCount}">1</span>
        </a>
        <a th:href="@{/channels}" title="渠道"  th:classappend="${activeItem == 'channels'} ? ' active'" th:attr="aria-current=${activeItem == 'channels' ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-publish"></use></svg><span class="nav-label">渠道</span>
        </a>
        <details class="sidebar-tools" th:open="${activeItem == 'ai' or activeItem == 'automation' or activeItem == 'recycle' or activeItem == 'jobs' or activeItem == 'monitoring' or activeItem == 'actions' or activeItem == 'calendar'}">
            <summary title="更多工具"><svg class="nav-icon" aria-hidden="true"><use href="#nav-automation"></use></svg><span class="nav-label">更多工具</span><svg class="settings-chevron" aria-hidden="true" viewBox="0 0 20 20"><use href="#nav-chevron"></use></svg></summary>
        <a th:href="@{/settings/ai}" title="AI 服务" th:if="${canAdmin}" th:classappend="${activeItem == 'ai'} ? ' active'" th:attr="aria-current=${activeItem == 'ai' ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-ai"></use></svg><span class="nav-label">AI 服务</span>
        </a>
        <a th:href="@{/actions}" title="待办"  th:classappend="${activeItem == 'actions'} ? ' active'" th:attr="aria-current=${activeItem == 'actions' ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-actions"></use></svg><span class="nav-label">待办</span><span class="nav-count" th:if="${navigationCounts.actionCount > 0}" th:text="${navigationCounts.actionCount}">1</span>
        </a>
        <a th:href="@{/jobs}" title="任务与重试"  th:classappend="${activeItem == 'jobs'} ? ' active'" th:attr="aria-current=${activeItem == 'jobs' ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-operations"></use></svg><span class="nav-label">任务与重试</span><span class="nav-count" th:if="${navigationCounts.jobAttentionCount > 0}" th:text="${navigationCounts.jobAttentionCount}">1</span>
        </a>
        <a th:href="@{/calendar}" title="发布日历"  th:classappend="${activeItem == 'calendar'} ? ' active'" th:attr="aria-current=${activeItem == 'calendar' ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-actions"></use></svg><span class="nav-label">发布日历</span>
        </a>
        <a th:href="@{/monitoring}" title="运行监控"  th:classappend="${activeItem == 'monitoring'} ? ' active'" th:attr="aria-current=${activeItem == 'monitoring' ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-operations"></use></svg><span class="nav-label">运行监控</span>
        </a>
        <a th:href="@{/automation}" title="自动化" th:if="${canAdmin}" th:classappend="${activeItem == 'automation'} ? ' active'" th:attr="aria-current=${activeItem == 'automation' ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-automation"></use></svg><span class="nav-label">自动化</span>
        </a>
        <a th:href="@{/recycle-bin}" title="回收站" th:if="${canAdmin}" th:classappend="${activeItem == 'recycle'} ? ' active'" th:attr="aria-current=${activeItem == 'recycle' ? 'page' : null}">
            <svg class="nav-icon" aria-hidden="true"><use href="#nav-recycle"></use></svg><span class="nav-label">回收站</span>
        </a>
        </details>
    </nav>

    <div class="sidebar-footer">
        <div class="account-menu" data-account-menu>
            <button class="account-card" type="button" data-account-toggle aria-expanded="false"
                    aria-controls="sidebar-account-panel" aria-label="打开账户菜单">
                <span class="account-avatar" th:text="${#strings.isEmpty(currentUsername) ? 'U' : #strings.substring(currentUsername,0,1).toUpperCase()}">A</span>
                <span class="account-copy"><strong th:text="${currentUsername}">admin</strong><small>个人工作区</small></span>
                <svg class="account-chevron" viewBox="0 0 20 20" aria-hidden="true"><use href="#nav-chevron"></use></svg>
            </button>
            <div id="sidebar-account-panel" class="account-panel" data-account-panel hidden>
                <header><strong th:text="${currentUsername}">admin</strong><small>当前登录账号</small></header>
                <div class="account-panel-actions" th:if="${localLogin}"><a th:href="@{/change-password}">修改密码</a>
                    <form th:action="@{/logout}" method="post"><button type="submit">退出登录</button></form></div>
                <p th:unless="${localLogin}">当前模式不使用本地账号登录。</p>
            </div>
        </div>
    </div>
</aside>

<header class="app-topbar" th:fragment="topbar(title, subtitle)">
    <button class="menu-button" type="button" data-sidebar-open aria-controls="app-sidebar" aria-expanded="false" aria-label="打开导航">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>
    <div><h1 th:text="${title}">页面标题</h1><p th:text="${subtitle}">页面说明</p></div>
    <button class="theme-toggle topbar-theme-toggle" type="button" data-theme-toggle>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.75v2M10 15.25v2M2.75 10h2M15.25 10h2M4.87 4.87l1.42 1.42M13.71 13.71l1.42 1.42M15.13 4.87l-1.42 1.42M6.29 13.71l-1.42 1.42"/><circle cx="10" cy="10" r="3.25"/></svg>
        <span data-theme-label>跟随系统</span>
    </button>
</header>
</body>
</html>
