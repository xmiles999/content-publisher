<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow"><title>自动化设置 · Content Publisher</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/logo.svg}">
    <link rel="stylesheet" th:href="@{/assets/app.css}"><script defer th:src="@{/assets/app.js}"></script></head>
<body class="app-page"><div class="app-layout"><aside th:replace="~{fragments/app-shell :: sidebar('automation')}"></aside>
<div class="app-main"><header th:replace="~{fragments/app-shell :: topbar('自动化设置', '管理生成预设与无秘密通知 Webhook')}"></header>
<main class="page-content"><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="alert success" th:if="${success}" th:text="${success}"></div>
<section class="page-header"><div><p class="section-kicker">生成策略</p><h2>服务端生成预设</h2><p>预设按租户保存，内容表单从服务端读取，不再依赖浏览器硬编码。</p></div></section>
<section class="workspace-panel"><header class="workspace-panel-header"><div><h3>新增或更新预设</h3><p>同一来源和名称会安全更新，不创建重复记录。</p></div></header>
<form class="stack-form" th:action="@{/automation/presets}" method="post"><div class="form-grid three"><div class="field"><label>名称</label><input name="name" maxlength="120" required></div><div class="field"><label>来源</label><select name="sourceType"><option value="PROJECT">Git 项目</option><option value="TOPIC">主题教程</option><option value="WEBSITE">网站推荐</option></select></div><div class="field"><label>语言（可选）</label><input name="language" maxlength="20"></div></div>
<div class="field"><label>语气</label><input name="tone" maxlength="100" required></div><div class="form-grid three"><div class="field"><label>最小字符</label><input name="minCharacters" type="number" min="200" max="3000" value="800" required></div><div class="field"><label>最大字符</label><input name="maxCharacters" type="number" min="200" max="3000" value="1800" required></div><div class="field"><label>关键词上限</label><input name="maxKeywords" type="number" min="1" max="30" value="10" required></div></div>
<div class="field"><label>必须章节</label><textarea name="requiredSections" rows="4" maxlength="2200"></textarea></div><div class="form-grid three"><div class="field"><label>文章类型</label><input name="articleType" maxlength="40"></div><div class="field"><label>知识层级</label><input name="knowledgeLevel" maxlength="40"></div><div class="field"><label>模型（可选）</label><input name="model" maxlength="200"></div></div><div class="field"><label>推荐角度</label><textarea name="recommendationAngle" rows="3" maxlength="2000"></textarea></div><button class="primary-button" type="submit">保存预设</button></form></section>
<section class="workspace-panel section-gap"><header class="workspace-panel-header"><div><h3>当前预设</h3><p>内置预设只读，自定义预设可删除。</p></div></header>
<div class="table-wrap"><table class="management-table"><thead><tr><th>来源</th><th>名称</th><th>篇幅</th><th>语气</th><th>操作</th></tr></thead><tbody>
<tr th:each="preset : ${#lists.concat(#lists.concat(projectPresets, topicPresets), websitePresets)}"><td th:text="${preset.sourceType}">PROJECT</td><td th:text="${preset.name}">预设</td><td th:text="|${preset.minCharacters}–${preset.maxCharacters}|">800</td><td th:text="${preset.tone}">语气</td><td><span th:if="${preset.builtin}">内置</span><form th:unless="${preset.builtin}" th:action="@{/automation/presets/{id}/delete(id=${preset.id})}" method="post" data-confirm="删除这个生成预设？"><button class="danger-link" type="submit">删除</button></form></td></tr>
</tbody></table></div></section>
<section class="workspace-panel section-gap"><header class="workspace-panel-header"><div><h3>通知 Webhook</h3><p>仅允许公网 HTTPS；不会发送凭据、正文草稿或客户数据。</p></div></header>
<form class="filter-bar" th:action="@{/automation/notification-endpoints}" method="post"><label>显示名称<input name="displayName" maxlength="120" required></label><label>Webhook URL<input name="webhookUrl" type="url" maxlength="2048" placeholder="https://hooks.example.com/publisher" required></label><button class="primary-button" type="submit">保存端点</button></form>
<div class="compact-list section-gap"><div class="compact-item" th:each="endpoint : ${notificationEndpoints}"><span><strong th:text="${endpoint.displayName}">端点</strong><small th:text="${endpoint.webhookUrl}">URL</small></span><form th:action="@{/automation/notification-endpoints/{id}/delete(id=${endpoint.id})}" method="post" data-confirm="删除这个通知端点？"><button class="danger-link" type="submit">删除</button></form></div><div class="empty-state" th:if="${#lists.isEmpty(notificationEndpoints)}">尚未配置通知端点。</div></div></section>
</main></div></div></body></html>
