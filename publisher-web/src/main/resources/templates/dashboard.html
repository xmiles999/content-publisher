<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow"><title>工作台 · Content Publisher</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/logo.svg}">
    <script th:src="@{/assets/theme-init.js}"></script><link rel="stylesheet" th:href="@{/assets/app.css}"><script defer th:src="@{/assets/app.js}"></script>
</head>
<body class="app-page">
<div class="app-layout">
    <aside th:replace="~{fragments/app-shell :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/app-shell :: topbar('工作台', '写稿、确认、再发到常用平台')}"></header>
        <main class="page-content">
            <section class="hero-banner">
                <div><p class="section-kicker">今日</p>
                    <h2>继续写，或把已确认的稿发出去</h2>
                    <p>一份主稿，多个平台。先写完并确认，再按你的常用渠道覆盖。</p></div>
                <div class="hero-actions"><a class="primary-link" th:href="@{/projects(source='custom')}">写新稿</a>
                    <a class="secondary-link" th:href="@{/publishing}">查看覆盖</a></div>
            </section>

            <section class="metric-grid" aria-label="文稿进度">
                <article class="metric-card"><span>文稿</span><strong th:text="${articleCount}">0</strong><small>已保存的主稿</small></article>
                <article class="metric-card"><span>写作中</span><strong th:text="${draftCount}">0</strong><small>待确认的草稿</small></article>
                <article class="metric-card"><span>可发布</span><strong th:text="${readyCount}">0</strong><small>已确认当前版本</small></article>
                <article class="metric-card"><span>待办</span><strong th:text="${actionCount}">0</strong><small>失败、待发或待确认</small></article>
            </section>

            <div class="grid-2 section-gap">
                <section class="card">
                    <div class="card-header"><div><p class="section-kicker">最近文稿</p><h3>继续编辑</h3></div>
                        <a class="text-link" th:href="@{/content}">全部文稿</a></div>
                    <div class="empty-state" th:if="${#lists.isEmpty(recentArticles)}">还没有文稿。从写新稿开始。</div>
                    <div class="compact-list" th:unless="${#lists.isEmpty(recentArticles)}">
                        <a class="compact-item" th:each="article : ${recentArticles}" th:href="@{/articles/{id}(id=${article.id})}">
                            <span><strong th:text="${article.title}">文章标题</strong><small th:text="|v${article.currentVersion}|">版本</small></span>
                            <span class="status-pill" th:classappend="| status-${article.status.name().toLowerCase()}|" th:text="${articleStatusNames.get(article.status)}">草稿</span>
                        </a>
                    </div>
                </section>
                <section class="card">
                    <div class="card-header"><div><p class="section-kicker">待办</p><h3>需要处理</h3></div>
                        <a class="text-link" th:href="@{/actions}">全部待办</a></div>
                    <div class="empty-state" th:if="${#lists.isEmpty(pendingActions)}">没有待处理事项。</div>
                    <div class="compact-list" th:unless="${#lists.isEmpty(pendingActions)}">
                        <a class="compact-item" th:each="item : ${pendingActions}" th:href="${item.targetUrl}">
                            <span><strong th:text="${item.title}">待办</strong><small th:text="${item.detail}">说明</small></span>
                            <strong th:text="${item.count}">1</strong>
                        </a>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
</body>
</html>
